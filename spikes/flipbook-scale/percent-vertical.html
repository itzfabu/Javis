<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Percent-based sprite, vertical strip, aspect-locked contained box (option c)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #04141a; color: #baffef; font-family: monospace; }
  .info { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: 10px 16px;
    background: rgba(0,0,0,0.8); font-size: 13px; display: flex; gap: 24px; flex-wrap: wrap; }
  .scroll-track { height: 900vh; position: relative; }
  .sticky-viewport { position: sticky; top: 0; height: 100vh; display: flex;
    align-items: center; justify-content: center; overflow: hidden; background: #0a1a22; }

  /* Vertical strip (400 x 57600, 96 frames stacked top-to-bottom), repacked
     from the SAME existing frame PNGs via Pillow - no new artwork. Same
     percentage technique, transposed: background-size height = 9600%,
     width = 100%; animate background-position-Y instead of X. */
  .sprite-box {
    height: min(78vh, 720px);
    aspect-ratio: 2 / 3;
    background-image: url('spritesheet-vertical.png');
    background-repeat: no-repeat;
    background-size: 100% 9600%;
    animation: scrub-frames-v steps(95, jump-none) both;
    animation-timeline: scroll(root block);
    outline: 2px solid rgba(255,180,90,0.4);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }
  @keyframes scrub-frames-v {
    from { background-position-y: 0%; }
    to   { background-position-y: 100%; }
  }
  .marker { position: absolute; left: 16px; font-size: 11px; opacity: 0.5; }
</style>
</head>
<body>
<div class="info">
  <span>PERCENT-VERTICAL (400x57600 strip, aspect-locked 2:3 box, position-Y stepped)</span>
  <span id="dbgViewport"></span>
  <span id="dbgScrollY">scrollY: 0</span>
  <span id="dbgFrame">frame: -</span>
  <span id="dbgBgPos">bgPosY: -</span>
</div>
<div class="scroll-track">
  <div class="marker" style="top: 0;">start</div>
  <div class="marker" style="top: 50%;">mid</div>
  <div class="marker" style="top: 100%; transform: translateY(-100%);">end</div>
  <div class="sticky-viewport">
    <div class="sprite-box" id="sprite"></div>
  </div>
</div>
<script>
const sprite = document.getElementById('sprite');
const dbgViewport = document.getElementById('dbgViewport');
const dbgScrollY = document.getElementById('dbgScrollY');
const dbgFrame = document.getElementById('dbgFrame');
const dbgBgPos = document.getElementById('dbgBgPos');
const N_FRAMES = 96;
function currentFrameFromBgPosPercent() {
  const cs = getComputedStyle(sprite);
  const percent = parseFloat(cs.backgroundPositionY) || 0; // returns "%" string, see percent-contained.html note
  const boxH = sprite.getBoundingClientRect().height;
  const frame = Math.round((percent / 100) * (N_FRAMES - 1));
  return { percent, frame, boxW: boxH };
}
function tick() {
  dbgViewport.textContent = 'viewport: ' + window.innerWidth + 'x' + window.innerHeight;
  dbgScrollY.textContent = 'scrollY: ' + Math.round(window.scrollY);
  const { px, frame } = currentFrameFromBgPosPercent();
  dbgFrame.textContent = 'frame: ' + frame;
  dbgBgPos.textContent = 'bgPosY(px): ' + px.toFixed(2);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
window.__currentFrame = () => currentFrameFromBgPosPercent();
</script>
</body>
</html>
