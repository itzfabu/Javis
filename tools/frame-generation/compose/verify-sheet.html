<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style> html, body { margin: 0; padding: 0; } </style>
</head>
<body>
<script>
/*
 * Sheet-integrity check: loads the ACTUAL WRITTEN sprite sheet file (not
 * the in-memory pre-encode canvas composite.html builds) and verifies it
 * against the grid layout the caller expects, per the vault's SHEET
 * INTEGRITY GUARD writeup. This is what actually catches the historical
 * blank-canvas bug (locator.screenshot() silently painting only a region
 * near the canvas origin for very wide canvases) - that bug happens during
 * the screenshot/encode step, so only a check that re-loads the real
 * on-disk file after writing can see it. Checking the pre-encode canvas
 * would not have caught it.
 *
 * FOUND WHILE BUILDING THIS, THEN RULED OUT AS THE ACTUAL BUG: drawing the
 * whole sheet image onto ONE canvas sized to match it (e.g. 76,800x1200,
 * ASSEMBLE's real strip width) and reading cells back via getImageData
 * returned all-ZERO data for every cell tested, including cell 0 near the
 * origin - worth recording because it looked at first like it was hiding
 * real content, but cross-checking against Pillow's independent read of
 * the exact same on-disk file proved the all-zero readback was itself
 * wrong (Pillow found real, if severely degraded, data: min 86/max 255,
 * std ~0.83 - overwhelmingly near-white with only a sparse scattering of
 * darker pixels, NOT a clean, intact frame the way an earlier session's
 * quick extrema-only spot-check had assumed). Reading each cell via its
 * own small, reused canvas and a cropped drawImage call
 * (`drawImage(img, sx, sy, sw, sh, 0, 0, dw, dh)`) matches Pillow's
 * ground-truth reading exactly, at every offset tested (including cols 1,
 * 50, and 95 of a 96-frame strip) - kept for that reason, not because the
 * one-giant-canvas approach was proven to hide real content. Net effect:
 * this project's earlier characterization of the historical blank-canvas
 * bug ("frame 0 paints, everything else is blank") undersold it - even
 * the frame nearest the origin is itself almost entirely corrupted to a
 * flat near-white, not intact. See the vault write-up for the corrected
 * account.
 *
 * Query params: sheetUrl, frameCount, cols, rows, frameW, frameH (all
 * required). Returns via window.__verifyResult once loaded - see
 * src/sheet-integrity.js for the three checks and their calibrated floors.
 */
const q = new URLSearchParams(location.search);
const sheetUrl = q.get('sheetUrl');
const frameCount = parseInt(q.get('frameCount'), 10);
const cols = parseInt(q.get('cols'), 10);
const rows = parseInt(q.get('rows'), 10);
const frameW = parseInt(q.get('frameW'), 10);
const frameH = parseInt(q.get('frameH'), 10);

async function loadImage(src) {
  const img = new Image();
  const loaded = new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = reject;
  });
  img.src = src;
  await loaded;
  await img.decode(); // stronger guarantee than onload that the raster decode has actually completed
  return img;
}

// Grayscale-ish luma per pixel, cheap, sufficient to detect "flat fill"
// (near-zero spread) vs. real rendered content - matches the calibration
// method used to pick the floors in src/sheet-integrity.js.
function statsFromImageData(data) {
  let sum = 0, sumSq = 0;
  const n = data.length / 4;
  const luma = new Float64Array(n);
  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    const l = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
    luma[p] = l;
    sum += l;
  }
  const mean = sum / n;
  for (let p = 0; p < n; p++) sumSq += (luma[p] - mean) ** 2;
  const std = Math.sqrt(sumSq / n);
  return { std, mean, data };
}

// Reads one cell via its OWN small canvas + a cropped drawImage call - see
// the header comment above for why this is used instead of one big canvas
// for the whole sheet.
function makeCellReader(frameW, frameH) {
  const canvas = document.createElement('canvas');
  canvas.width = frameW;
  canvas.height = frameH;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  return (img, col, row) => {
    ctx.clearRect(0, 0, frameW, frameH);
    ctx.drawImage(img, col * frameW, row * frameH, frameW, frameH, 0, 0, frameW, frameH);
    const data = ctx.getImageData(0, 0, frameW, frameH).data;
    return statsFromImageData(data);
  };
}

// Mean absolute per-channel difference between two equally-sized cell
// ImageData buffers - the same metric used to calibrate the near-zero
// threshold against real archetype data (see sheet-integrity.js header).
function meanAbsDiff(dataA, dataB) {
  let total = 0;
  const n = dataA.length;
  for (let i = 0; i < n; i += 4) {
    total += Math.abs(dataA[i] - dataB[i]) + Math.abs(dataA[i + 1] - dataB[i + 1]) + Math.abs(dataA[i + 2] - dataB[i + 2]);
  }
  return total / ((n / 4) * 3);
}

async function run() {
  try {
    const img = await loadImage(sheetUrl);
    const expectedW = cols * frameW;
    const expectedH = rows * frameH;

    const dimsOk = img.naturalWidth === expectedW && img.naturalHeight === expectedH;

    const readCell = makeCellReader(frameW, frameH);
    const cells = [];
    for (let i = 0; i < frameCount; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      cells.push(readCell(img, col, row));
    }

    const adjacentDiffs = [];
    for (let i = 0; i < frameCount - 1; i++) {
      adjacentDiffs.push(meanAbsDiff(cells[i].data, cells[i + 1].data));
    }

    window.__verifyResult = {
      dimsOk,
      actualWidth: img.naturalWidth,
      actualHeight: img.naturalHeight,
      expectedWidth: expectedW,
      expectedHeight: expectedH,
      cellStds: cells.map((c) => +c.std.toFixed(3)),
      adjacentDiffs: adjacentDiffs.map((d) => +d.toFixed(4)),
    };
  } catch (err) {
    window.__verifyError = String(err);
  }
}
run();
</script>
</body>
</html>
