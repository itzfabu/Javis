<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style> html, body { margin: 0; padding: 0; } </style>
</head>
<body>
<canvas id="sheet"></canvas>
<script>
/*
 * Stitches N individually-captured frame PNGs into one horizontal sprite
 * sheet, per Thread 3's output spec (one sprite sheet per client/archetype,
 * horizontal strip, frames left-to-right). Runs in a real browser (via
 * Playwright) rather than a Node image library so canvas drawImage/
 * toDataURL/screenshot readback is used directly - no new image-processing
 * dependency (sharp, Pillow, etc.) beyond the Playwright/Chromium this
 * project already depends on for frame capture itself.
 *
 * Query params: frameCount, frameW, frameH (all required). Frame images are
 * expected at /frames/frame-0000.png, /frames/frame-0001.png, ... (same
 * origin as this page, served by src/static-server.js, so canvas readback
 * is never blocked by cross-origin taint).
 */
const q = new URLSearchParams(location.search);
const frameCount = parseInt(q.get('frameCount'), 10);
const frameW = parseInt(q.get('frameW'), 10);
const frameH = parseInt(q.get('frameH'), 10);

const canvas = document.getElementById('sheet');
canvas.width = frameW * frameCount;
canvas.height = frameH;
const ctx = canvas.getContext('2d');

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function run() {
  for (let i = 0; i < frameCount; i++) {
    const name = `frame-${String(i).padStart(4, '0')}.png`;
    const img = await loadImage(`/frames/${name}`);
    ctx.drawImage(img, i * frameW, 0, frameW, frameH);
  }
  window.__ready = true;
}
run().catch((err) => {
  window.__error = String(err);
});
</script>
</body>
</html>
