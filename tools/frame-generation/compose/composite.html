<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style> html, body { margin: 0; padding: 0; } </style>
</head>
<body>
<canvas id="sheet"></canvas>
<script>
/*
 * Stitches N individually-captured frame PNGs into a 2D grid sprite sheet
 * (cols x rows), per the GRID SPRITE LAYOUT rework: a 1xN horizontal strip
 * exceeds libwebp's 16383px per-dimension limit at these frame counts/
 * resolutions, so frames are laid out left-to-right, top-to-bottom instead,
 * wrapping to a new row every `cols` frames. Runs in a real browser (via
 * Playwright) so canvas drawImage/getImageData/toDataURL is used directly -
 * no new image-processing dependency. WebP encoding uses the browser's own
 * native canvas.toDataURL('image/webp', quality) - Chromium has supported
 * this for years; no library needed for that either.
 *
 * Query params: frameCount, frameW, frameH, cols, rows (all required).
 * Frame images are expected at /frames/frame-0000.png, /frames/frame-0001.png,
 * ... (same origin as this page, served by src/static-server.js, so canvas
 * readback is never blocked by cross-origin taint).
 */
const q = new URLSearchParams(location.search);
const frameCount = parseInt(q.get('frameCount'), 10);
const frameW = parseInt(q.get('frameW'), 10);
const frameH = parseInt(q.get('frameH'), 10);
const cols = parseInt(q.get('cols'), 10);
const rows = parseInt(q.get('rows'), 10);

const canvas = document.getElementById('sheet');
canvas.width = frameW * cols;
canvas.height = frameH * rows;
const ctx = canvas.getContext('2d');

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function run() {
  for (let i = 0; i < frameCount; i++) {
    const name = `frame-${String(i).padStart(4, '0')}.png`;
    const img = await loadImage(`/frames/${name}`);
    const col = i % cols;
    const row = Math.floor(i / cols);
    ctx.drawImage(img, col * frameW, row * frameH, frameW, frameH);
  }
  window.__ready = true;
}

// Called from composite.js after __ready - returns a WebP data URL for the
// whole sheet. Kept as an explicit, separately-invoked step (not run inside
// run() automatically) so the caller controls exactly when encoding happens
// and can time it separately from compositing if ever useful.
window.__toWebpDataUrl = (quality) => canvas.toDataURL('image/webp', quality);

run().catch((err) => {
  window.__error = String(err);
});
</script>
</body>
</html>
