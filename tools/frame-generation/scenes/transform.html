<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="/vendor/three.min.js"></script>
<script src="/scenes/shared.js"></script>
<script>
/*
 * TRANSFORM archetype template scene.
 * Renovation/fitness/beauty (+ cosmetic dental/medical): a before/after
 * wipe. Two overlapping planes ("before": rougher/duller material in the
 * accent color; "after": polished material in the primary color) with the
 * "after" plane clipped by a moving THREE.Plane that sweeps left-to-right
 * as t goes 0-1, revealing it over the "before" plane underneath. Uses
 * three.js's native clipping-plane support (r128) rather than a custom
 * shader - no new technique to hand-roll.
 */
const P = FrameScene.parseParams();
const { renderer, scene, camera } = FrameScene.setupBasic(P);
FrameScene.addThreeLightRig(scene);

camera.position.set(0, 0, 3.4);
camera.lookAt(0, 0, 0);

const PLANE_W = 2.6, PLANE_H = 1.7;

const beforeGeo = new THREE.PlaneGeometry(PLANE_W, PLANE_H);
const beforeMat = new THREE.MeshStandardMaterial({ color: P.accent, roughness: 0.95, metalness: 0 });
const beforePlane = new THREE.Mesh(beforeGeo, beforeMat);
beforePlane.position.z = -0.01;
scene.add(beforePlane);

// The clip plane's normal points in -X; a point is clipped (hidden) when
// plane.constant + normal.dot(point) < 0. Sweeping constant from -PLANE_W/2
// to +PLANE_W/2 moves the reveal edge from fully-hidden to fully-shown.
const clipPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), -PLANE_W / 2);

// The "after" plane's real bug, found and fixed 2026-08-06: a flat,
// untextured, glossy plane in a light/neutral brand color (the fixture that
// caught this: Birds Barbershop, primary #DCD7D1) washes out to a near-blank
// panel under the light rig - measured std~4.99, the lowest legitimate value
// across all six archetypes' real captured frames (see FORMAT/LAYOUT CELL
// FILLED's occlusion-floor calibration - and see that section's own
// correction below: the true lowest was actually INTERFACE's frame 3 at
// 1.315, not this one - the floor itself is unaffected either way). This
// isn't a one-off fixture quirk: light/neutral palettes are common for
// premium brands, so any client with one would hit the same wash-out on the
// "after" state - the animation's own resting point (see vault: TRANSFORM
// END STATE). A procedurally-generated grain canvas texture gives the
// surface real tonal variance, reading as a genuine finished material
// (brushed/polished texture, a common cross-category "premium finish"
// convention) rather than a flat color swatch, without depending on any
// specific client's actual content.
//
// SOURCE RESOLUTION IS DELIBERATELY LOW (64px), NOT A DETAIL OVERSIGHT: a
// first attempt generated true per-pixel randomness at 512px and measured
// the real cost before shipping it - the composited sprite sheet grew from
// 89.6KB to 587.5KB (6.5x) for TRANSFORM's approved-logo state, because
// independent per-pixel noise is exactly the content PNG/WebP compress
// worst (no spatial redundancy to exploit, unlike the smooth gradients and
// flat fills the rest of this scene produces). A 64px source, magnified by
// the GPU's own default linear texture filtering onto the much larger
// rendered plane, produces a visually similar soft grain (adjacent rendered
// pixels are interpolated from a coarser noise field, not independently
// random) at a fraction of the entropy cost - measured below, not assumed.
function makeGrainTexture() {
  const size = 64;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);
  const img = ctx.getImageData(0, 0, size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 215 + Math.floor(Math.random() * 40); // 215-255 - measured, not guessed: 235-255 (20-unit range) barely moved std after WebP compression; 195-255 (60-unit) gave a clear std improvement (4.99->13.25) but pushed TRANSFORM's real measured LCP from 1.04s/1.06s to 2.54s/2.73s, OUT of Good - a real regression, caught by re-measuring, not assumed safe. This 40-unit range is the settled middle ground - re-verify its own LCP figure below before trusting it either
    img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  // A handful of soft, elongated streaks layered on top, at the SAME low
  // resolution (not the full plane) - reads as a brushed/polished
  // directional finish, giving the surface larger-scale structure on top of
  // the fine grain, not just noise at one scale. Lines, unlike random
  // per-pixel noise, are already cheap to encode (long runs of similar
  // pixels) - resolution isn't the concern here, consistency with the grain
  // canvas is.
  ctx.globalAlpha = 0.06;
  for (let i = 0; i < 8; i++) {
    ctx.strokeStyle = i % 2 === 0 ? '#000000' : '#ffffff';
    ctx.lineWidth = 0.5 + Math.random() * 0.5;
    const y = Math.random() * size;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(size, y + (Math.random() - 0.5) * 6);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  // Explicit, not relying on the THREE.CanvasTexture default: linear
  // magnification is exactly what makes the low-res source read as smooth
  // grain instead of blocky pixelation once stretched over the plane.
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearFilter;
  return tex;
}

const afterGeo = new THREE.PlaneGeometry(PLANE_W, PLANE_H);
const afterMat = new THREE.MeshStandardMaterial({
  color: P.primary,
  map: makeGrainTexture(),
  roughness: 0.25,
  metalness: 0.15,
  clippingPlanes: [clipPlane],
  clipShadows: true,
});
const afterPlane = new THREE.Mesh(afterGeo, afterMat);
scene.add(afterPlane);

// A thin bar marks the moving wipe edge itself - makes the transition line
// legible as a deliberate wipe, not just an ambiguous color change.
const edgeGeo = new THREE.BoxGeometry(0.03, PLANE_H, 0.05);
const edgeMat = new THREE.MeshStandardMaterial({ color: '#FFFFFF', roughness: 0.4 });
const edge = new THREE.Mesh(edgeGeo, edgeMat);
edge.position.z = 0.02;
scene.add(edge);

const signboard = FrameScene.makeLogoPlane(P, 0.75, 0.35);
signboard.position.set(0, 0.55, 0.03); // within camera frustum, verified via the frustum-check guard, not just eyeballed
scene.add(signboard);
window.__frustumCheck = () => FrameScene.checkFrustum(camera, signboard);
window.__occlusionCheck = (opts) => FrameScene.checkOcclusion(renderer, scene, camera, signboard, opts);

window.__renderFrame = function (t) {
  // normal=(-1,0,0): a point is visible (not clipped) where -point.x + constant >= 0,
  // i.e. point.x <= constant - so sweeping constant left-to-right sweeps the reveal edge the same way.
  const threshold = -PLANE_W / 2 + PLANE_W * t;
  clipPlane.constant = threshold;
  edge.position.x = threshold;
  FrameScene.updateLogoOpacity(signboard, P, t);
  renderer.render(scene, camera);
};
window.__renderFrame(0);
window.__ready = true;
</script>
</body>
</html>
