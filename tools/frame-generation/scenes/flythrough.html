<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="/vendor/three.min.js"></script>
<script src="/scenes/shared.js"></script>
<script>
/*
 * FLYTHROUGH archetype template scene.
 * Real estate/hotels/gyms/venues + general/family dental & medical: the
 * camera glides forward through a receding sequence of frames (a generic
 * "space", not a specific room-by-room capture of a client's actual
 * interior - per Recommendation #2, this ships disclosed-as-stylized by
 * default; a real multi-room walkthrough is the paid add-on, out of this
 * pipeline's scope). Fixed geometry/camera path; color/logo/background
 * parametrized per client.
 */
const P = FrameScene.parseParams();
const { renderer, scene, camera } = FrameScene.setupBasic(P);
FrameScene.addThreeLightRig(scene);

const N_ARCHES = 6;
const SPACING = 2.2;
const palette = [P.primary, P.accent, P.tertiary];

for (let i = 0; i < N_ARCHES; i++) {
  const geo = new THREE.TorusGeometry(1.15, 0.09, 16, 48);
  const mat = new THREE.MeshStandardMaterial({
    color: palette[i % palette.length],
    roughness: 0.5,
    metalness: 0.15,
  });
  const arch = new THREE.Mesh(geo, mat);
  arch.position.z = -i * SPACING;
  scene.add(arch);

  // A floor strip per bay reinforces the sense of moving through a space,
  // not just past floating rings.
  const floorGeo = new THREE.BoxGeometry(2.6, 0.06, SPACING);
  const floorMat = new THREE.MeshStandardMaterial({ color: P.bg, roughness: 0.85 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.position.set(0, -1.1, -i * SPACING - SPACING / 2);
  scene.add(floor);
}

const signboard = FrameScene.makeLogoPlane(P, 0.6, 0.3);
signboard.position.set(0, 0.35, -(N_ARCHES - 0.6) * SPACING); // within camera frustum, verified via the frustum-check guard AND checked for occlusion by the floor strips (see BUILD note)
scene.add(signboard);
window.__frustumCheck = () => FrameScene.checkFrustum(camera, signboard);
window.__occlusionCheck = (opts) => FrameScene.checkOcclusion(renderer, scene, camera, signboard, opts);

// CAMERA PATH - fixed 2026-08-06, see vault: SHEET INTEGRITY GUARD's
// FLYTHROUGH finding and the follow-up fix note. The old path
// (totalDepth = (N_ARCHES-1)*SPACING = 11.0, ending at camera z=-9.5) left
// the last frame (t=1.0) completely blank - not a rendering bug, a real
// geometry/FOV interaction verified directly (three.js Vector3.project()
// on ring 5's own tube vertices, not assumed): every ring, including this
// one, has a narrow VISIBILITY WINDOW while the camera approaches it - it
// grows to fill the frame, then vanishes entirely once the camera is close
// enough that the ring's own angular size (tube radius ~1.24 world units)
// exceeds the ~17.5 degree half-FOV in every direction at once, at which
// point every point on the tube's circumference projects outside the
// [-1,1] NDC screen bounds simultaneously - not a partial crop, a total
// disappearance. Measured directly: ring 5's own vanish point is around
// distance 1.9-2.0 from its z position (visible at distance 2.05, gone by
// 1.83). The old path drove the camera to distance 1.5 from the last ring
// at t=1.0 - INSIDE the vanished zone, with nothing beyond ring 5 (no
// ring 6) to fill the frame instead, unlike every earlier ring's vanish
// point, which is immediately followed by the next ring coming into view.
// Fix: stop the camera at a distance from the last ring that's
// comfortably inside its confirmed-visible range, not at a fixed total
// travel distance that happens to overshoot it.
const START_DISTANCE = 1.5; // matches the scene's original starting offset before ring 0
const END_DISTANCE = 2.5; // stops with real margin above ring 5's measured ~1.9-2.0 vanish threshold
const lastRingZ = -(N_ARCHES - 1) * SPACING;

camera.position.set(0, 0.1, START_DISTANCE);
camera.lookAt(0, 0, -1);

const totalDepth = START_DISTANCE - (lastRingZ + END_DISTANCE);

window.__renderFrame = function (t) {
  camera.position.z = 1.5 - totalDepth * t;
  // Small, slow lateral drift reads as a handheld/gimbal glide rather than a
  // perfectly rigid dolly - a deliberate, cheap touch of "camera operator"
  // realism, not required for the mechanism to work.
  camera.position.x = Math.sin(t * Math.PI * 2) * 0.08;
  camera.lookAt(camera.position.x * 0.5, 0, camera.position.z - 1);
  FrameScene.updateLogoOpacity(signboard, P, t);
  renderer.render(scene, camera);
};
window.__renderFrame(0);
window.__ready = true;
</script>
</body>
</html>
